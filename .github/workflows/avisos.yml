name: Avisos (manual)
# Para probar los avisos privados por Telegram: whoami | registrar | grupos | salud
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "whoami, registrar, grupos o salud"
        default: whoami
permissions:
  contents: write
  actions: read
jobs:
  aviso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          CMD: ${{ inputs.cmd }}
        run: |
          case "$CMD" in whoami|registrar|grupos|salud) python scripts/aviso.py "$CMD";; *) echo "comando no válido"; exit 1;; esac
          git config user.name "ojoalprecio-bot"; git config user.email "ojoalprecio-bot@users.noreply.github.com"
          [ -f data/admin.enc ] && git add data/admin.enc; git diff --cached --quiet || (git commit -qm "Alta de avisos" && git pull --rebase -X theirs -q && git push -q)

name: Carrusel (manual)
on:
  workflow_dispatch:
    inputs:
      args:
        description: "vacío = Facebook + Telegram; --sin-facebook = solo Telegram"
        default: ""
permissions:
  contents: write
jobs:
  carrusel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography requests pillow
      - env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ARGS: ${{ inputs.args }}
        run: |
          case "$ARGS" in ""|--sin-facebook) python scripts/carrusel.py $ARGS;; *) exit 1;; esac
          git config user.name "ojoalprecio-bot"; git config user.email "ojoalprecio-bot@users.noreply.github.com"
          git add data/carrusel/usados.json docs/tt; git diff --cached --quiet || (git commit -qm "Carrusel" && git pull --rebase -X theirs -q && git push -q)

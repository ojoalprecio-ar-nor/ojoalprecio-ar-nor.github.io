name: Actualizar ofertas
on:
  schedule:
    - cron: "7 11,23 * * *"   # 08:07 y 20:07 hora argentina
  workflow_dispatch:
    inputs:
      auth_code:
        description: "Código de autorización de Mercado Libre (solo la primera vez, empieza con TG-)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install cryptography
      - name: Leer Mercado Libre y generar la web
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_AUTH_CODE: ${{ github.event.inputs.auth_code }}
        run: python scripts/update.py
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "ojoalprecio-bot"
          git config user.email "ojoalprecio-bot@users.noreply.github.com"
          for f in docs/data.json data/history.json data/token.enc; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "Ofertas actualizadas"
          git push

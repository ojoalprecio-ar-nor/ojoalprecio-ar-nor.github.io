name: Publicar en Telegram
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: telegram
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar oferta
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/telegram.py
      - name: Guardar
        run: |
          git config user.name "ojoalprecio-bot"
          git config user.email "ojoalprecio-bot@users.noreply.github.com"
          [ -f data/posted.json ] && git add data/posted.json
          git diff --cached --quiet || git commit -m "Oferta publicada en Telegram"
          git pull --rebase -X theirs -q && git push

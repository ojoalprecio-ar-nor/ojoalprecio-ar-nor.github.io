name: Cambiar portada de Facebook
on:
  workflow_dispatch: {}
jobs:
  cover:
    runs-on: ubuntu-latest
    steps:
      - name: URL de la foto subida
        env:
          T: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          curl -s "https://graph.facebook.com/v21.0/122102938659539185?fields=images&access_token=$T" | python3 -c "import sys,json;d=json.load(sys.stdin);print('IMG', max(d['images'],key=lambda x:x['width'])['source'])"
